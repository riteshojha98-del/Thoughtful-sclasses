<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thoughtful's Home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase (compat build — works with plain <script> tags, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<!-- React (no build step — JSX is transpiled in the browser by Babel below) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root {
    --board: #2B4033;
    --board-soft: #354C3D;
    --chalk: #F4F1E6;
    --chalk-faint: #A9BCAE;
    --yellow: #E8B94E;
    --coral: #D2665A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .th-root { min-height: 100vh; background: var(--board); color: var(--chalk); font-family: 'Work Sans', sans-serif; padding-bottom: 3rem; }
  .font-hand { font-family: 'Kalam', cursive; }
  .text-chalk { color: var(--chalk); }
  .text-chalk-faint { color: var(--chalk-faint); }
  .mb-3 { margin-bottom: .75rem; } .mb-4 { margin-bottom: 1rem; } .mt-3 { margin-top: .75rem; } .text-xl { font-size: 1.25rem; }
  .th-header { padding: 1.5rem 1.25rem 0; max-width: 880px; margin: 0 auto; }
  .th-header-inner { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  .wordmark { font-family: 'Kalam', cursive; font-weight: 700; font-size: 2rem; line-height: 1.1; margin: 0; }
  .tagline { color: var(--chalk-faint); font-size: .85rem; margin-top: .15rem; }
  .chalk-hr { height: 2px; background: repeating-linear-gradient(90deg, var(--chalk-faint) 0 8px, transparent 8px 14px); opacity: .5; margin-top: 1rem; }
  .chip-btn { border: 1.5px solid var(--chalk-faint); color: var(--chalk); background: transparent; border-radius: 999px; padding: .35rem .9rem; font-size: .8rem; cursor: pointer; white-space: nowrap; }
  .chip-btn:hover { border-color: var(--chalk); }
  .th-main { max-width: 880px; margin: 0 auto; padding: 1.5rem 1.25rem 0; }
  .auth-card { max-width: 380px; margin: 2rem auto 0; }
  .welcome-line { color: var(--chalk-faint); font-size: .9rem; margin-bottom: .75rem; }
  .tab-bar { display: flex; gap: .5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .tab-btn { background: transparent; border: 1.5px solid var(--board-soft); color: var(--chalk-faint); padding: .45rem 1rem; border-radius: 8px; font-size: .85rem; cursor: pointer; }
  .tab-btn:hover { color: var(--chalk); }
  .tab-btn-active { background: var(--board-soft); color: var(--yellow); border-color: var(--yellow); }
  .board-card { background: var(--board-soft); border: 1.5px dashed var(--chalk-faint); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .field-label { display: block; font-size: .78rem; color: var(--chalk-faint); margin-bottom: .3rem; }
  .field-hint { font-size: .75rem; color: var(--chalk-faint); margin: -.3rem 0 .75rem; }
  .text-input, .file-input { width: 100%; background: var(--board); border: 1px solid var(--chalk-faint); color: var(--chalk); border-radius: 6px; padding: .55rem .7rem; font-family: 'Work Sans', sans-serif; font-size: .9rem; }
  .text-input:focus, .file-input:focus { outline: 2px solid var(--yellow); outline-offset: 1px; }
  .file-chosen { font-size: .78rem; color: var(--chalk-faint); margin-top: -.4rem; margin-bottom: .75rem; }
  .primary-btn { background: var(--yellow); color: #2B2311; border: none; border-radius: 8px; padding: .6rem 1.3rem; font-weight: 600; font-size: .9rem; cursor: pointer; }
  .primary-btn:hover { filter: brightness(1.06); }
  .primary-btn:disabled { opacity: .6; cursor: not-allowed; }
  .form-error { color: var(--coral); font-size: .85rem; margin: .5rem 0; }
  .form-success { color: var(--yellow); font-size: .85rem; margin: .5rem 0; }
  .loading-line { color: var(--chalk-faint); font-size: .85rem; }
  .assignment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 620px) { .assignment-grid { grid-template-columns: 1fr; } }
  .assignment-card { background: var(--board-soft); border: 1.5px dashed var(--chalk-faint); border-radius: 10px; padding: 1rem; }
  .assignment-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
  .assignment-title { font-family: 'Kalam', cursive; font-size: 1.15rem; margin: 0 0 .25rem; }
  .assignment-desc { font-size: .85rem; color: var(--chalk-faint); margin-bottom: .75rem; }
  .assignment-card-bottom { display: flex; justify-content: space-between; align-items: center; }
  .file-badge { font-size: .65rem; font-weight: 700; letter-spacing: .05em; padding: .2rem .5rem; border-radius: 4px; }
  .file-badge-pdf { background: var(--coral); color: #2B2311; }
  .file-badge-img { background: var(--yellow); color: #2B2311; }
  .due-pill { font-size: .72rem; color: var(--chalk-faint); border: 1px solid var(--chalk-faint); border-radius: 999px; padding: .1rem .55rem; }
  .link-btn { background: none; border: none; color: var(--yellow); font-size: .82rem; cursor: pointer; padding: 0; }
  .link-btn:hover { text-decoration: underline; }
  .link-btn-danger { color: var(--coral); }
  .empty-board { text-align: center; padding: 2.5rem 1rem; }
  .option-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .55rem; }
  .option-radio { accent-color: var(--yellow); width: 1.1rem; height: 1.1rem; flex-shrink: 0; }
  .live-badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
  .live-badge { color: var(--coral); font-size: .8rem; font-weight: 700; animation: pulse 1.6s ease-in-out infinite; }
  .ended-badge { color: var(--chalk-faint); font-size: .8rem; font-weight: 600; }
  .response-count { font-size: .78rem; color: var(--chalk-faint); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .live-badge { animation: none; } }
  .results-list { display: flex; flex-direction: column; gap: .65rem; margin-bottom: 1rem; }
  .result-row-label { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: .25rem; }
  .result-bar-track { background: var(--board); border-radius: 999px; height: 8px; overflow: hidden; }
  .result-bar-fill { background: var(--yellow); height: 100%; border-radius: 999px; transition: width .4s ease; }
  .result-row-correct .result-bar-fill { background: #7FBF8E; }
  .result-row-correct .result-row-label { color: #7FBF8E; }
  .quiz-actions { display: flex; gap: .6rem; }
  .mcq-options { display: flex; flex-direction: column; gap: .6rem; }
  .mcq-option { text-align: left; background: var(--board); border: 1.5px solid var(--chalk-faint); color: var(--chalk); border-radius: 8px; padding: .65rem .9rem; font-size: .92rem; cursor: pointer; }
  .mcq-option:disabled { cursor: default; }
  .mcq-option:not(:disabled):hover { border-color: var(--yellow); }
  .mcq-option-picked { border-color: var(--yellow); background: rgba(232,185,78,.1); }
  .mcq-option-correct { border-color: #7FBF8E; background: rgba(127,191,142,.12); }
  .waiting-line { font-size: .85rem; color: var(--chalk-faint); margin-top: .9rem; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* =========================================================
   1. FIREBASE CONFIG — replace these with YOUR project's values
   Firebase console → Project settings → Your apps → Web app
========================================================= */
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID",
};
const TEACHER_EMAIL = "riteshojha98@gmail.com";
const MAX_FILE_BYTES = 8 * 1024 * 1024;

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

/* ========================= APP ========================= */

function App() {
  const [user, setUser] = useState(undefined);
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    return auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        const snap = await db.collection("users").doc(u.uid).get();
        setProfile(snap.exists ? snap.data() : null);
      } else {
        setProfile(null);
      }
    });
  }, []);

  return (
    <div className="th-root">
      <header className="th-header">
        <div className="th-header-inner">
          <div>
            <h1 className="wordmark">Thoughtful&apos;s Home</h1>
            <p className="tagline">पढ़ाई ka apna kona — your own corner to learn</p>
          </div>
          {user && <button className="chip-btn" onClick={() => auth.signOut()}>Log out</button>}
        </div>
        <div className="chalk-hr" />
      </header>
      <main className="th-main">
        {user === undefined && <p className="loading-line">Loading…</p>}
        {user === null && <Auth />}
        {user && !profile && <p className="loading-line">Setting up your account…</p>}
        {user && profile && profile.role === "teacher" && <TeacherView profile={profile} />}
        {user && profile && profile.role === "student" && <StudentView profile={profile} />}
      </main>
    </div>
  );
}

function Auth() {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setBusy(true);
    try {
      if (mode === "signup") {
        const cred = await auth.createUserWithEmailAndPassword(email.trim(), password);
        const role = email.trim().toLowerCase() === TEACHER_EMAIL.toLowerCase() ? "teacher" : "student";
        await db.collection("users").doc(cred.user.uid).set({
          name: name.trim() || email.split("@")[0],
          email: email.trim(),
          role,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      } else {
        await auth.signInWithEmailAndPassword(email.trim(), password);
      }
    } catch (err) {
      setError(friendlyError(err.code));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="board-card auth-card">
      <p className="font-hand text-xl text-chalk mb-3">{mode === "login" ? "Login karein" : "Naya account banayein"}</p>
      <form onSubmit={submit}>
        {mode === "signup" && (
          <>
            <label className="field-label">Naam</label>
            <input className="text-input mb-3" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Ananya Singh" />
          </>
        )}
        <label className="field-label">Email</label>
        <input type="email" className="text-input mb-3" value={email} onChange={(e) => setEmail(e.target.value)} required />
        <label className="field-label">Password</label>
        <input type="password" className="text-input mb-3" value={password} onChange={(e) => setPassword(e.target.value)} required minLength={6} />
        {error && <p className="form-error">{error}</p>}
        <button className="primary-btn" type="submit" disabled={busy}>{busy ? "Please wait…" : mode === "login" ? "Log in" : "Sign up"}</button>
      </form>
      <button className="link-btn mt-3" onClick={() => { setMode(mode === "login" ? "signup" : "login"); setError(""); }}>
        {mode === "login" ? "New student? Sign up" : "Already have an account? Log in"}
      </button>
    </div>
  );
}

function friendlyError(code) {
  const map = {
    "auth/email-already-in-use": "Ye email pehle se registered hai — login try karein.",
    "auth/invalid-email": "Email sahi format mein nahi hai.",
    "auth/weak-password": "Password kam se kam 6 characters ka hona chahiye.",
    "auth/wrong-password": "Password galat hai.",
    "auth/user-not-found": "Ye email registered nahi hai — pehle sign up karein.",
    "auth/invalid-credential": "Email ya password galat hai.",
  };
  return map[code] || "Kuch gadbad ho gayi, dobara try karein.";
}

/* ---------------------- teacher ---------------------- */

function TeacherView({ profile }) {
  const [tab, setTab] = useState("assignments");
  return (
    <div>
      <p className="welcome-line">Teacher — <strong>{profile.name}</strong></p>
      <div className="tab-bar">
        {[["assignments","Assignments"],["post","Post assignment"],["quiz","Live MCQ"]].map(([k,l]) => (
          <button key={k} className={`tab-btn ${tab===k?"tab-btn-active":""}`} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>
      {tab === "assignments" && <AssignmentList editable />}
      {tab === "post" && <PostAssignment onPosted={() => setTab("assignments")} />}
      {tab === "quiz" && <TeacherQuiz />}
    </div>
  );
}

function TeacherQuiz() {
  const [quiz, setQuiz] = useState(null);
  const [responses, setResponses] = useState([]);
  const [question, setQuestion] = useState("");
  const [options, setOptions] = useState(["", "", "", ""]);
  const [correct, setCorrect] = useState(0);

  useEffect(() => {
    return db.collection("quiz").doc("current").onSnapshot((snap) => {
      setQuiz(snap.exists ? snap.data() : null);
    });
  }, []);

  useEffect(() => {
    if (!quiz) { setResponses([]); return; }
    return db.collection("quiz").doc("current").collection("responses").onSnapshot((snap) => {
      setResponses(snap.docs.map((d) => d.data()));
    });
  }, [quiz && quiz.id]);

  const startQuiz = async (e) => {
    e.preventDefault();
    if (!question.trim() || options.some((o) => !o.trim())) return;
    const old = await db.collection("quiz").doc("current").collection("responses").get();
    const batch = db.batch();
    old.docs.forEach((d) => batch.delete(d.ref));
    await batch.commit();
    await db.collection("quiz").doc("current").set({
      id: Date.now().toString(36),
      question: question.trim(),
      options: options.map((o) => o.trim()),
      correctIndex: correct,
      isLive: true,
      revealed: false,
      startedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    setQuestion(""); setOptions(["", "", "", ""]); setCorrect(0);
  };

  const revealAnswer = async () => {
    await db.collection("quiz").doc("current").set({ ...quiz, isLive: false, revealed: true });
  };
  const clearQuiz = async () => {
    await db.collection("quiz").doc("current").delete();
  };

  const total = responses.length;
  const counts = quiz ? quiz.options.map((_, i) => responses.filter((r) => r.choice === i).length) : [];

  return (
    <div>
      {!quiz && (
        <form className="board-card" onSubmit={startQuiz}>
          <p className="font-hand text-xl text-chalk mb-3">Naya sawaal likhiye</p>
          <label className="field-label">Question</label>
          <input className="text-input mb-3" value={question} onChange={(e) => setQuestion(e.target.value)} placeholder="e.g. Which of these is a unit of force?" />
          {options.map((opt, i) => (
            <div key={i} className="option-row">
              <input type="radio" name="correct" checked={correct === i} onChange={() => setCorrect(i)} className="option-radio" />
              <input className="text-input" value={opt} placeholder={`Option ${i+1}`} onChange={(e) => { const next=[...options]; next[i]=e.target.value; setOptions(next); }} />
            </div>
          ))}
          <p className="field-hint">Correct option ke saamne wala radio button select karein.</p>
          <button type="submit" className="primary-btn">Go live</button>
        </form>
      )}
      {quiz && (
        <div className="board-card">
          <div className="live-badge-row">
            {quiz.isLive ? <span className="live-badge">● LIVE</span> : <span className="ended-badge">Ended</span>}
            <span className="response-count">{total} response{total === 1 ? "" : "s"}</span>
          </div>
          <p className="font-hand text-xl text-chalk mb-4">{quiz.question}</p>
          <div className="results-list">
            {quiz.options.map((opt, i) => {
              const pct = total ? Math.round((counts[i] / total) * 100) : 0;
              const isCorrect = quiz.revealed && i === quiz.correctIndex;
              return (
                <div key={i} className={`result-row ${isCorrect ? "result-row-correct" : ""}`}>
                  <div className="result-row-label"><span>{opt}</span><span>{pct}%</span></div>
                  <div className="result-bar-track"><div className="result-bar-fill" style={{ width: `${pct}%` }} /></div>
                </div>
              );
            })}
          </div>
          <div className="quiz-actions">
            {quiz.isLive && <button className="primary-btn" onClick={revealAnswer}>Reveal answer</button>}
            {!quiz.isLive && <button className="primary-btn" onClick={clearQuiz}>New question</button>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------- student ---------------------- */

function StudentView({ profile }) {
  const [tab, setTab] = useState("assignments");
  return (
    <div>
      <p className="welcome-line">Welcome back, <strong>{profile.name}</strong></p>
      <div className="tab-bar">
        {[["assignments","Assignments"],["quiz","Live Quiz"]].map(([k,l]) => (
          <button key={k} className={`tab-btn ${tab===k?"tab-btn-active":""}`} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>
      {tab === "assignments" && <AssignmentList editable={false} />}
      {tab === "quiz" && <StudentQuiz profile={profile} />}
    </div>
  );
}

function StudentQuiz({ profile }) {
  const [quiz, setQuiz] = useState(undefined);
  const [myChoice, setMyChoice] = useState(null);

  useEffect(() => {
    return db.collection("quiz").doc("current").onSnapshot((snap) => {
      setQuiz(snap.exists ? snap.data() : null);
    });
  }, []);

  useEffect(() => {
    setMyChoice(null);
    if (!quiz || !quiz.id) return;
    const uid = auth.currentUser.uid;
    db.collection("quiz").doc("current").collection("responses").doc(uid).get().then((snap) => {
      if (snap.exists) setMyChoice(snap.data().choice);
    });
  }, [quiz && quiz.id]);

  const submitAnswer = async (choiceIndex) => {
    if (!quiz || myChoice !== null) return;
    setMyChoice(choiceIndex);
    const uid = auth.currentUser.uid;
    await db.collection("quiz").doc("current").collection("responses").doc(uid).set({
      name: profile.name,
      choice: choiceIndex,
      at: Date.now(),
    });
  };

  if (quiz === undefined) return <p className="loading-line">Loading…</p>;
  if (!quiz) return <div className="empty-board"><p className="text-chalk-faint font-hand text-lg">Abhi koi live quiz nahi hai. Teacher shuru karenge toh yahin dikhega.</p></div>;

  return (
    <div className="board-card">
      <div className="live-badge-row">
        {quiz.isLive ? <span className="live-badge">● LIVE</span> : <span className="ended-badge">Ended</span>}
      </div>
      <p className="font-hand text-xl text-chalk mb-4">{quiz.question}</p>
      <div className="mcq-options">
        {quiz.options.map((opt, i) => {
          const picked = myChoice === i;
          const isCorrect = quiz.revealed && i === quiz.correctIndex;
          const answered = myChoice !== null;
          return (
            <button key={i} disabled={answered || !quiz.isLive} onClick={() => submitAnswer(i)}
              className={`mcq-option ${picked ? "mcq-option-picked" : ""} ${isCorrect ? "mcq-option-correct" : ""}`}>
              {opt}
            </button>
          );
        })}
      </div>
      {myChoice !== null && !quiz.revealed && <p className="waiting-line">Jawab record ho gaya — teacher ke reveal karne ka wait karein.</p>}
      {quiz.revealed && (
        <p className={myChoice === quiz.correctIndex ? "form-success" : "form-error"}>
          {myChoice === quiz.correctIndex ? "Sahi jawab! 🎉" : "Is baar nahi — agli baar zaroor."}
        </p>
      )}
    </div>
  );
}

/* ---------------------- assignments (shared) ---------------------- */

function AssignmentList({ editable }) {
  const [items, setItems] = useState(null);

  useEffect(() => {
    return db.collection("assignments").orderBy("createdAt", "desc").onSnapshot((snap) => {
      setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
  }, []);

  const removeItem = async (item) => {
    try { if (item.storagePath) await storage.ref(item.storagePath).delete(); } catch {}
    await db.collection("assignments").doc(item.id).delete();
  };

  if (items === null) return <p className="loading-line">Loading…</p>;
  if (items.length === 0) return (
    <div className="empty-board">
      <p className="text-chalk-faint font-hand text-lg">{editable ? "Abhi koi assignment nahi hai — pehla post karein." : "Koi assignment abhi tak nahi aaya."}</p>
    </div>
  );

  return (
    <div className="assignment-grid">
      {items.map((item) => (
        <div key={item.id} className="assignment-card">
          <div className="assignment-card-top">
            <span className={`file-badge ${item.fileType === "application/pdf" ? "file-badge-pdf" : "file-badge-img"}`}>
              {item.fileType === "application/pdf" ? "PDF" : "IMG"}
            </span>
            {item.dueDate && <span className="due-pill">Due {item.dueDate}</span>}
          </div>
          <h3 className="assignment-title">{item.title}</h3>
          {item.description && <p className="assignment-desc">{item.description}</p>}
          <div className="assignment-card-bottom">
            <a className="link-btn" href={item.fileURL} target="_blank" rel="noreferrer">Open file →</a>
            {editable && <button className="link-btn link-btn-danger" onClick={() => removeItem(item)}>Remove</button>}
          </div>
        </div>
      ))}
    </div>
  );
}

function PostAssignment({ onPosted }) {
  const [title, setTitle] = useState("");
  const [description, setDescription] = useState("");
  const [dueDate, setDueDate] = useState("");
  const [file, setFile] = useState(null);
  const [status, setStatus] = useState(null);
  const [busy, setBusy] = useState(false);

  const handleFile = (e) => {
    const f = e.target.files[0];
    setStatus(null);
    if (!f) return setFile(null);
    const okType = ["application/pdf", "image/jpeg", "image/png"].includes(f.type);
    if (!okType) { setStatus({ type: "error", msg: "Sirf PDF ya JPG/PNG allowed hai." }); return setFile(null); }
    if (f.size > MAX_FILE_BYTES) { setStatus({ type: "error", msg: "File 8MB se chhoti honi chahiye." }); return setFile(null); }
    setFile(f);
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!title.trim() || !file) { setStatus({ type: "error", msg: "Title aur file dono zaroori hain." }); return; }
    setBusy(true); setStatus(null);
    try {
      const path = `assignments/${Date.now()}_${file.name}`;
      const snapshot = await storage.ref(path).put(file);
      const fileURL = await snapshot.ref.getDownloadURL();
      await db.collection("assignments").add({
        title: title.trim(),
        description: description.trim(),
        dueDate: dueDate || null,
        fileType: file.type,
        fileName: file.name,
        fileURL,
        storagePath: path,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setTitle(""); setDescription(""); setDueDate(""); setFile(null);
      setStatus({ type: "success", msg: "Assignment post ho gaya!" });
      onPosted && onPosted();
    } catch {
      setStatus({ type: "error", msg: "Upload fail ho gaya, dobara try karein." });
    } finally {
      setBusy(false);
    }
  };

  return (
    <form className="board-card" onSubmit={submit}>
      <p className="font-hand text-xl text-chalk mb-3">New assignment likhiye</p>
      <label className="field-label">Title</label>
      <input className="text-input mb-3" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Chapter 4 — Motion, Q1 to Q10" />
      <label className="field-label">Description (optional)</label>
      <textarea className="text-input mb-3" rows={3} value={description} onChange={(e) => setDescription(e.target.value)} />
      <label className="field-label">Due date (optional)</label>
      <input type="date" className="text-input mb-3" value={dueDate} onChange={(e) => setDueDate(e.target.value)} />
      <label className="field-label">File — PDF or JPG/PNG, under 8MB</label>
      <input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={handleFile} className="file-input mb-3" />
      {file && <p className="file-chosen">Selected: {file.name}</p>}
      {status && <p className={status.type === "error" ? "form-error" : "form-success"}>{status.msg}</p>}
      <button type="submit" className="primary-btn" disabled={busy}>{busy ? "Uploading…" : "Post assignment"}</button>
    </form>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
